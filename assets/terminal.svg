<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
  <style>
    .t { font-family: 'Fira Code', 'Consolas', 'Courier New', monospace; font-size: 15px; }
    .p { fill: #7aa2f7; } .c { fill: #c0caf5; } .o { fill: #9ece6a; } .y { fill: #e0af68; } .m { fill: #bb9af7; }
    .cur { fill: #c0caf5; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/><stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <clipPath id="l1"><rect x="20" y="58" height="24" width="0"><animate attributeName="width" from="0" to="780" begin="0.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="20" y="82" height="24" width="0"><animate attributeName="width" from="0" to="780" begin="1.1s" dur="0.01s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="20" y="118" height="24" width="0"><animate attributeName="width" from="0" to="780" begin="1.6s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="20" y="142" height="24" width="0"><animate attributeName="width" from="0" to="780" begin="2.5s" dur="0.01s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="20" y="178" height="24" width="0"><animate attributeName="width" from="0" to="780" begin="3.0s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="20" y="202" height="24" width="0"><animate attributeName="width" from="0" to="780" begin="3.9s" dur="0.01s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="20" y="238" height="24" width="0"><animate attributeName="width" from="0" to="780" begin="4.4s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l8"><rect x="20" y="262" height="24" width="0"><animate attributeName="width" from="0" to="780" begin="5.3s" dur="1.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="820" height="300" rx="12" fill="url(#bg)" stroke="#2f334d"/>
  <circle cx="24" cy="22" r="6" fill="#f7768e"/><circle cx="44" cy="22" r="6" fill="#e0af68"/><circle cx="64" cy="22" r="6" fill="#9ece6a"/>
  <text x="410" y="27" text-anchor="middle" class="t" fill="#565f89" font-size="13">zaeem@dbn: ~</text>

  <g class="t">
    <text x="24" y="76" clip-path="url(#l1)"><tspan class="p">❯ </tspan><tspan class="c">whoami</tspan></text>
    <text x="24" y="100" clip-path="url(#l2)" class="o">Zaeem Patel — full-stack developer · Durban, South Africa 🇿🇦</text>

    <text x="24" y="136" clip-path="url(#l3)"><tspan class="p">❯ </tspan><tspan class="c">cat stack.txt</tspan></text>
    <text x="24" y="160" clip-path="url(#l4)" class="y">Next.js · Node.js · PostgreSQL · Redis · ASP.NET MVC · WordPress</text>

    <text x="24" y="196" clip-path="url(#l5)"><tspan class="p">❯ </tspan><tspan class="c">ls ./building</tspan></text>
    <text x="24" y="220" clip-path="url(#l6)" class="m">web-apps/  enterprise-systems/  api-integrations/  automations/</text>

    <text x="24" y="256" clip-path="url(#l7)"><tspan class="p">❯ </tspan><tspan class="c">./learn --next</tspan></text>
    <text x="24" y="280" clip-path="url(#l8)" class="o">Power Apps ▸ Power Automate ▸ Power BI  ✔</text>
  </g>
  <rect x="24" y="268" width="9" height="16" class="cur" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="6.6s" dur="0.01s" fill="freeze"/>
    <animate attributeName="x" from="24" to="420" begin="6.6s" dur="0.01s" fill="freeze"/>
  </rect>
</svg>
