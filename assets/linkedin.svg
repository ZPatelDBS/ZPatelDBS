<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Open a comms channel: connect with Zaeem Patel on LinkedIn">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .thin { font-family: 'Helvetica Neue', 'Segoe UI', ui-sans-serif, Helvetica, Arial, sans-serif; }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s cubic-bezier(.2,.7,.3,1) infinite; }
    @keyframes ring { 0% { transform: scale(.2); opacity: .9 } 100% { transform: scale(1); opacity: 0 } }
    .orbit { transform-origin: 170px 110px; animation: spin 9s linear infinite; }
    .orbit2 { transform-origin: 170px 110px; animation: spin 15s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .sweep { transform-origin: 170px 110px; animation: spin 4s linear infinite; }
    .beam { stroke-dasharray: 6 14; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -40 } }
    .packet { animation: packet 2.2s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes packet { 0% { transform: translateX(0); opacity: 0 } 10% { opacity: 1 } 90% { opacity: 1 } 100% { transform: translateX(590px); opacity: 0 } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .btn { animation: glow 2.4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { filter: drop-shadow(0 0 2px #7dd3fc) } 50% { filter: drop-shadow(0 0 12px #7dd3fc) } }
    .border { stroke-dasharray: 40 360; animation: trace 3s linear infinite; }
    @keyframes trace { to { stroke-dashoffset: -400 } }
    .arrow { animation: nudge 1.2s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0) } 50% { transform: translateX(6px) } }
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan { from { transform: translateY(-20px) } to { transform: translateY(240px) } }
    .type { animation: type 1.6s steps(26) .3s both; }
    @keyframes type { from { width: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <radialGradient id="bg" cx="15%" cy="50%" r="90%"><stop offset="0" stop-color="#0d1426"/><stop offset="1" stop-color="#04050a"/></radialGradient>
    <linearGradient id="beamg" x1="0" x2="1"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".9"/><stop offset="1" stop-color="#7dd3fc" stop-opacity=".15"/></linearGradient>
    <linearGradient id="scang" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset="1" stop-color="#7dd3fc" stop-opacity=".08"/></linearGradient>
    <linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset="1" stop-color="#7dd3fc" stop-opacity=".35"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="220" rx="14"/></clipPath>
    <clipPath id="typeclip"><rect class="type" x="300" y="40" width="440" height="30"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <!-- stars -->
    <g fill="#f4f1ea">
      <circle class="tw" cx="420" cy="30" r="1.1"/><circle class="tw" style="animation-delay:.7s" cx="560" cy="190" r="1"/>
      <circle class="tw" style="animation-delay:1.4s" cx="690" cy="22" r="1.3"/><circle class="tw" style="animation-delay:2.1s" cx="880" cy="200" r="1"/>
      <circle class="tw" style="animation-delay:.3s" cx="1010" cy="18" r="1.2"/><circle class="tw" style="animation-delay:1.1s" cx="1150" cy="196" r="1"/>
      <circle class="tw" style="animation-delay:1.8s" cx="330" cy="200" r="1"/><circle class="tw" style="animation-delay:2.5s" cx="760" cy="120" r=".9"/>
      <circle class="tw" style="animation-delay:.9s" cx="40" cy="30" r="1"/><circle class="tw" style="animation-delay:1.6s" cx="270" cy="24" r="1.1"/>
    </g>
    <!-- scan line -->
    <rect class="scan" x="0" y="0" width="1200" height="20" fill="url(#scang)"/>

    <!-- radar: rings, sweep, orbits -->
    <g fill="none" stroke="#1b2a44">
      <circle cx="170" cy="110" r="40"/><circle cx="170" cy="110" r="70"/><circle cx="170" cy="110" r="96"/>
      <line x1="74" y1="110" x2="266" y2="110"/><line x1="170" y1="14" x2="170" y2="206"/>
    </g>
    <path class="sweep" d="M170 110 L266 110 A96 96 0 0 0 237.9 42.1 Z" fill="url(#sweepg)"/>
    <circle class="ring" cx="170" cy="110" r="96" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle class="ring" style="animation-delay:.8s" cx="170" cy="110" r="96" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle class="ring" style="animation-delay:1.6s" cx="170" cy="110" r="96" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
    <g class="orbit"><circle cx="170" cy="40" r="4" fill="#ffb257"/><circle cx="170" cy="40" r="9" fill="#ffb257" fill-opacity=".18"/></g>
    <g class="orbit2"><rect x="232" y="104" width="10" height="10" rx="2" fill="#f4f1ea"/><rect x="220" y="107" width="10" height="4" fill="#7dd3fc"/><rect x="244" y="107" width="10" height="4" fill="#7dd3fc"/></g>
    <!-- dish -->
    <g transform="translate(170 110)">
      <path d="M-22 -6 A26 26 0 0 0 10 22" fill="none" stroke="#f4f1ea" stroke-width="3" stroke-linecap="round"/>
      <line x1="-6" y1="8" x2="10" y2="-8" stroke="#f4f1ea" stroke-width="2"/>
      <circle cx="12" cy="-10" r="3.5" fill="#7dd3fc"/>
      <path d="M-4 14 L-12 26 L4 26 Z" fill="#8a90a3"/>
    </g>

    <!-- beam to button -->
    <line class="beam" x1="270" y1="110" x2="830" y2="110" stroke="url(#beamg)" stroke-width="2"/>
    <g class="packet"><circle cx="270" cy="110" r="4" fill="#7dd3fc"/><circle cx="270" cy="110" r="10" fill="#7dd3fc" fill-opacity=".2"/></g>
    <g class="packet" style="animation-delay:1.1s"><circle cx="270" cy="110" r="3" fill="#ffb257"/></g>

    <!-- text -->
    <g class="mono" font-size="12" letter-spacing="2.5">
      <circle class="blink" cx="306" cy="34" r="4" fill="#f7768e"/>
      <text x="318" y="38" fill="#8a90a3">TRANSMITTING · CHANNEL OPEN</text>
    </g>
    <g clip-path="url(#typeclip)">
      <text x="300" y="66" class="thin" font-size="24" font-weight="300" letter-spacing="4" fill="#f4f1ea">ESTABLISH CONTACT</text>
    </g>
    <text x="300" y="186" class="mono" font-size="12" letter-spacing="2" fill="#8a90a3">linkedin.com/in/zaeempatel</text>
    <text x="300" y="168" class="mono" font-size="11" letter-spacing="2" fill="#1f6f99">SIGNAL STRONG · LATENCY 0.4s · DBN → WORLD</text>

    <!-- button -->
    <g class="btn">
      <rect x="830" y="78" width="330" height="64" rx="32" fill="#0b1830" stroke="#1f6f99" stroke-width="1.5"/>
      <rect class="border" x="830" y="78" width="330" height="64" rx="32" fill="none" stroke="#7dd3fc" stroke-width="2.5" pathLength="400"/>
      <text x="980" y="116" text-anchor="middle" class="thin" font-size="17" letter-spacing="2" fill="#f4f1ea">CONNECT ON LINKEDIN</text>
      <g class="arrow"><path d="M1118 104 L1130 110 L1118 116" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="219" rx="14" fill="none" stroke="#1b2231"/>
</svg>
